[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

# REVERTED 2026-08-24: a www.vyralbro.in -> vyralbro.in redirect briefly
# lived here (two commits, now reverted) to route around a duplicate,
# Redis-less Netlify deployment answering www traffic. It caused a full
# site outage: vyralbro.in itself redirects to www.vyralbro.in somewhere
# ahead of this file (Netlify's own domain/alias config, not anything in
# this repo), so the www -> apex rule fought that and looped forever, on
# every request, cookies or not. Reverting to stop the outage. Real fix
# needs the actual domain/alias setup checked directly in Netlify's
# dashboard before any redirect is reintroduced here — see
# vyralbro-netlify-railway-domain-split-2026-08-24.md.
